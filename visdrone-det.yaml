## 调整锚点配置（适配无人机小目标）
#anchors:
#  - [3,4,  5,8,  6,12]    # P3/8
#  - [9,16, 12,24, 19,32]  # P4/16
#  - [24,48, 38,64, 48,96] # P5/32


# 修改锚点尺寸（更适配小目标）
anchors:
  - [2,3, 4,5, 5,7]     # P3/8 (XSmall)
  - [3,4, 5,8, 6,12]    # P4/16
  - [9,16, 12,24, 19,32] # P5/32

# 调整类别权重（更匹配VisDrone分布）
cls_weights: [1.2, 1.0, 3.0, 0.8, 1.5, 3.5, 3.2, 4.0, 4.5, 2.0]

# 增强小目标处理
augments:
  small_object_scale: 1.5  # 小目标放大系数
  small_object_area: 512    # 小目标面积阈值(32x16)
  min_objects: 10           # 每图最少目标数