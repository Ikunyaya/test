# VisDrone2019-DET dataset https://github.com/VisDrone/VisDrone-Dataset by Tianjin University

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: D:/object_detection/EDNet-main/datasets/Visdrone2019 # Please change to your proper dataset root dir
train: D:/object_detection/EDNet-main/datasets/Visdrone2019/VisDrone2019-DET-train/images # train images (relative to 'path')  6471 images
val: D:/object_detection/EDNet-main/datasets/Visdrone2019/VisDrone2019-DET-val/images # val images (relative to 'path')  548 images
test: D:/object_detection/EDNet-main/datasets/Visdrone2019/VisDrone2019-DET-test-dev/images # test images (optional)  1610 images

# Classes
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor

